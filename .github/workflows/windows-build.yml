name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          foreach($f in @('bridge.ps1','gui.ps1','tests/smoke.ps1')){
            $t=$null; $e=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f),[ref]$t,[ref]$e)
            if($e.Count){throw "$f : $($e | Out-String)"}
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows executable
        shell: pwsh
        run: |
          dotnet publish src/BridgeAntigravityPatch/BridgeAntigravityPatch.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Compress-Archive -Path dist/* -DestinationPath BridgeAntigravityPatch-win-x64.zip
          Get-FileHash BridgeAntigravityPatch-win-x64.zip -Algorithm SHA256 | ForEach-Object {"$($_.Hash.ToLower())  BridgeAntigravityPatch-win-x64.zip"} | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BridgeAntigravityPatch-win-x64
          path: |
            BridgeAntigravityPatch-win-x64.zip
            SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" BridgeAntigravityPatch-win-x64.zip SHA256SUMS.txt --title "$env:GITHUB_REF_NAME" --notes "Experimental unsigned Windows build."
